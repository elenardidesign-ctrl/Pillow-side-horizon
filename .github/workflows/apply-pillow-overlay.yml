name: Apply Pillow-Side overlay

on:
  push:
    paths:
      - '.github/workflows/apply-pillow-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct overlay archive
        run: |
          cat .pillow-overlay/chunk_* > /tmp/pillow-overlay.b64
          base64 -d /tmp/pillow-overlay.b64 > /tmp/pillow-overlay.tar.gz
          tar -tzf /tmp/pillow-overlay.tar.gz

      - name: Apply Pillow-Side files and store settings
        run: |
          tar -xzf /tmp/pillow-overlay.tar.gz -C .
          test -f templates/product.pillow-side.json
          test -f assets/ps-product-page.css
          test -f assets/ps-product-page.js
          test -f blocks/ps-buybox-highlights.liquid
          test -f sections/ps-hero.liquid
          test -f snippets/ps-assets.liquid

      - name: Remove transfer helpers
        run: |
          rm -rf .pillow-overlay
          rm -f .github/workflows/apply-pillow-overlay.yml

      - name: Commit Pillow-Side overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Pillow-Side product page and preserve theme settings"
          git push origin HEAD:main
